<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Pharmacie Adja</title>
    <link rel="stylesheet" href="./Css/contact.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="./Assets/Logo pharmacie.jpg" alt="Logo Pharmacie Adja">
        </a>
        <h1>Contactez-nous</h1>
    </header>
    <main>
        <section class="contact">
            <h2>Nous contacter</h2>
            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input type="text" id="name" name="name" placeholder="Entrez votre nom complet" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Entrez votre message" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Envoyer</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; 2025 Pharmacie Adja. Tous droits réservés.</p>
    </footer>
</body>
</html>
