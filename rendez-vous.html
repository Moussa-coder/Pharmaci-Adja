<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prendre un Rendez-vous - Pharmacie Adja</title>
    <link rel="stylesheet" href="./Css/rv.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="./Assets/Logo pharmacie.jpg" alt="Logo Pharmacie Adja">
        </a>
        <h1>Prendre un Rendez-vous</h1>
    </header>
    <main>
        <section class="rendezvous">
            <h2>Formulaire de Rendez-vous</h2>
            <form action="#" method="POST" class="rendezvous-form">
                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input type="text" id="name" name="name" placeholder="Entrez votre nom complet" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Entrez votre numéro de téléphone" required>
                </div>
                <div class="form-group">
                    <label for="date">Date du rendez-vous</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="message">Message (optionnel)</label>
                    <textarea id="message" name="message" placeholder="Ajoutez un message ou une demande spécifique"></textarea>
                </div>
                <button type="submit" class="btn-submit">Envoyer</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; 2025 Pharmacie Adja. Tous droits réservés.</p>
    </footer>
</body>
</html>
